services:
  - type: web
    name: zhy-companion-api
    runtime: python
    plan: 0.5c-512mb
    rootDir: servidor-inteligencia
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn zhy_companion_servidor.iniciar_servidor:aplicacion --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /salud/preparado
    autoDeploy: true
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zhy-companion-db
          property: connectionString
      - key: SECRETO_FIRMA_SESIONES
        generateValue: true
      - key: CONTRASENA_APLICACION
        sync: false
      - key: ORIGENES_PERMITIDOS
        value: "*"
      - key: MODELOS_LITELLM_PRIORIDAD
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: MINIMAX_API_KEY
        sync: false
  - type: web
    name: zhy-companion-web
    runtime: static
    staticPublishPath: ./aplicacion-cliente
    buildCommand: echo "Cliente estático sin compilación"

databases:
  - name: zhy-companion-db
    plan: 0.1c-256mb
