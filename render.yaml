services:
  - type: web
    name: zhy-companion-api
    runtime: python
    plan: free
    rootDir: servidor-inteligencia
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn zhy_companion_servidor.iniciar_servidor:aplicacion --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /salud/preparado
    autoDeploy: true
    envVars:
      - key: SECRETO_FIRMA_SESIONES
        generateValue: true
      - key: CONTRASENA_APLICACION
        sync: false
      - key: ORIGENES_PERMITIDOS
        value: "https://carol111uwu.github.io"
      - key: MODELOS_LITELLM_PRIORIDAD
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: MINIMAX_API_KEY
        sync: false
