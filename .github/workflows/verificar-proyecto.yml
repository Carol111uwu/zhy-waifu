name: Verificar ZHY Companion
on:
  push:
  pull_request:
jobs:
  cliente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node ./aplicacion-cliente/pruebas/ejecutar-pruebas-basicas.mjs
  servidor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: servidor-inteligencia/requirements*.txt
      - name: Instalar dependencias de pruebas
        working-directory: servidor-inteligencia
        run: pip install -r requirements-dev.txt
      - name: Ejecutar pruebas del servidor
        working-directory: servidor-inteligencia
        run: PYTHONPATH=src pytest -q pruebas
